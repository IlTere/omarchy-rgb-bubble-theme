# RGB Bubble dark shell palette. Translucent midnight surfaces let the
# floating wallpapers show through while keeping text and controls legible.

[rgb-bubble]
watermark = "true"

[bar]
background = "#0A101B"
background-alpha = 0.14
text = "#E6F0FF"
active = "#FF7184"
size-horizontal = 30
size-vertical = 32

[hyprland]
active-border = "rgba(255,113,132,ff) rgba(74,214,154,ff) 38deg"
active-border-foreground = "rgba(115,163,255,ff) rgba(74,214,154,ff) 38deg"

[controls]
normal-color = "#AFC9F2"
normal-fill-alpha = 0.05
normal-border = "#E6F0FF"
normal-border-width = 1
normal-border-alpha = 0.18

hover-cursor-color = "#73A3FF"
hover-cursor-fill-alpha = 0.16
hover-cursor-border = "#73A3FF"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.35

focus-color = "accent"
focus-fill-alpha = 0.18
focus-border = "accent"
focus-border-width = 1
focus-border-alpha = 0.40

selected-color = "accent"
selected-fill-alpha = 0.20
selected-border = "#73A3FF"
selected-border-width = 1
selected-border-alpha = 0.50

pressed-color = "#FF7184"
pressed-fill-alpha = 0.24
selection-color = "accent"
selection-fill-alpha = 0.24

[spacing]
scale = 1.06
scale-with-font = true

[font]
base-size = 12

[popups]
background = "#0A101B"
background-alpha = 0.14
text = "#E6F0FF"
border = "#E6F0FF"
border-alpha = 0.28
border-width = 1

[tooltip]
background = "#0A101B"
background-alpha = 0.45
text = "#F8FBFF"
border = "#E6F0FF"
border-alpha = 0.28
border-width = 1

[notifications]
background = "#0A101B"
background-alpha = 0.14
text = "#E6F0FF"
border = "#E6F0FF"
border-alpha = 0.28
border-width = 1
countdown = "#73A3FF"

[launcher]
background = "#0A101B"
background-alpha = 0.14
text = "#E6F0FF"
border = "#E6F0FF"
border-alpha = 0.28
border-width = 1
scrim = "#0A101B"
scrim-alpha = 0.5
selected-background = "#73A3FF"
selected-background-alpha = 0.14
selected-text = "#F8FBFF"
selected-border = "#FF7184 #4AD69A #73A3FF 45deg"
selected-border-alpha = 0.85
selected-border-width = 1

[menu]
background = "#0A101B"
background-alpha = 0.14
text = "#E6F0FF"
border = "#E6F0FF"
border-alpha = 0.28
border-width = 1
scrim = "#0A101B"
scrim-alpha = 0.5
selected-background = "#73A3FF"
selected-background-alpha = 0.14
selected-text = "#F8FBFF"
selected-border = "#FF7184 #4AD69A #73A3FF 45deg"
selected-border-alpha = 0.85
selected-border-width = 1

[polkit]
background = "#0A101B"
background-alpha = 0.14
text = "#E6F0FF"
text-error = "#FF7184"
border = "#E6F0FF"
border-error = "#FF7184"
border-alpha = 0.32
border-width = 1
scrim = "#04070D"
scrim-alpha = 0.45
accent = "#73A3FF"

[lock]
background = "#0A101B"
background-alpha = 0.14
text = "#E6F0FF"
placeholder = "#8D9DB4"
text-error = "#FF7184"
border = "#E6F0FF"
border-active = "#73A3FF"
border-error = "#FF7184"
border-alpha = 0.32
border-width = 1
selection = "#73A3FF"
selection-alpha = 0.42

[image-picker]
scrim = "#04070D"
scrim-alpha = 0.28
text = "#F8FBFF"
selected-border = "#73A3FF"
selected-border-alpha = 0.80
selected-border-width = 2
unselected-border = "#E6F0FF"
unselected-border-alpha = 0.25
unselected-border-width = 1
