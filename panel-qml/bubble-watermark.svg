<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7184"/>
      <stop offset="0.48" stop-color="#4ad69a"/>
      <stop offset="1" stop-color="#73a3ff"/>
    </linearGradient>
    <linearGradient id="blue-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73a3ff"/>
      <stop offset="0.54" stop-color="#65dce2"/>
      <stop offset="1" stop-color="#4ad69a"/>
    </linearGradient>
    <linearGradient id="green-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ad69a"/>
      <stop offset="0.54" stop-color="#73a3ff"/>
      <stop offset="1" stop-color="#ff7184"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="fine-grain" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="grain-in-rims"/>
      <feBlend in="SourceGraphic" in2="grain-in-rims" mode="screen"/>
    </filter>
    <symbol id="bubble" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" stroke="url(#rgb)" stroke-width="5" opacity="0.16" filter="url(#soft-glow)"/>
      <circle cx="50" cy="50" r="46" stroke="url(#rgb)" stroke-width="2.4" opacity="0.42"/>
      <circle cx="50" cy="50" r="42" stroke="#c8e0ff" stroke-width="0.8" opacity="0.12"/>
      <path d="M 18.7 29.8 A 37.3 37.3 0 0 1 69.8 15.0" stroke="#eaf4ff" stroke-width="1.8" stroke-linecap="round" opacity="0.44"/>
      <path d="M 83.1 65.6 A 38.2 38.2 0 0 1 39.9 87.3" stroke="url(#blue-green)" stroke-width="2" stroke-linecap="round" opacity="0.34"/>
      <ellipse cx="28" cy="22" rx="5.5" ry="2.1" transform="rotate(-35 28 22)" fill="#f4f8ff" opacity="0.24"/>
    </symbol>
  </defs>

  <g filter="url(#fine-grain)">
    <use href="#bubble" x="58" y="50" width="68" height="68"/>
    <use href="#bubble" x="238" y="60" width="44" height="44"/>
    <use href="#bubble" x="427" y="45" width="86" height="86"/>
    <use href="#bubble" x="554" y="174" width="48" height="48"/>
    <use href="#bubble" x="69" y="227" width="54" height="54"/>
    <use href="#bubble" x="210" y="185" width="90" height="90"/>
    <use href="#bubble" x="402" y="217" width="60" height="60"/>
    <use href="#bubble" x="524" y="314" width="72" height="72"/>
    <use href="#bubble" x="65" y="383" width="94" height="94"/>
    <use href="#bubble" x="269" y="359" width="46" height="46"/>
    <use href="#bubble" x="380" y="378" width="100" height="100"/>
    <use href="#bubble" x="553" y="513" width="50" height="50"/>
    <use href="#bubble" x="209" y="525" width="70" height="70"/>
    <use href="#bubble" x="53" y="551" width="42" height="42"/>
  </g>
</svg>
